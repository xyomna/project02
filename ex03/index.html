<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Color Palette</h1>

    <div class="named">Named: red</div>
    <div class="hex">HEX: #0000FF</div>
    <div class="rgb">RGB: rgb(0, 255, 0)</div>
    <div class="rgba">RGBA: rgba(255, 0, 0, 0.5)</div>

    <div class="opacity-box">
        <p>Opacity: 0.5</p>
    </div>

    <div class="rgba-box">
        <p>RGBA background: 0.5</p>
    </div>
</body>
</html>
